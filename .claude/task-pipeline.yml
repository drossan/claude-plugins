# task-pipeline — configuración del repo
#
# Las skills del plugin (/plan-task, /mutation, /task-init) LEEN este archivo y lo
# respetan; además, design-review, scenario-coverage y fact-checker leen su fase en `models:`.
# No hay parser: el modelo lo interpreta. Edítalo para adaptar el pipeline a ESTE
# repo (stack, qué fases son obligatorias, etc.).
#
# RESOLUCIÓN (de menor a mayor prioridad):
#   1. Defaults internos (equivalen al preset `full`).
#   2. El preset de `mode:` (si lo pones) pisa los defaults.
#   3. Cualquier clave explícita en `stack:` / `features:` pisa al preset.
#   → Archivo, sección o clave ausente = se hereda del nivel anterior.
#   → Sin archivo en el repo = todo `full` (comportamiento histórico del plugin).
#
# Los dos checkpoints humanos (grilling y la aprobación del plan) NO son
# configurables por ningún flag ni preset: son por diseño.

# ── Preset ──────────────────────────────────────────────────────────────────
# full       → todo obligatorio: TDD + 3 capas de doc + gate de mutation (break 80).
# legacy     → hay forma de testear lo que tocas (TDD ON) pero SIN gate de mutation
#              (un codebase legacy no llega a 80); docs ON.
# docs-only  → solo orquestación de planes y documentación: TDD OFF + gate OFF, docs ON.
mode: full

# ── Stack del repo ────────────────────────────────────────────────────────────
# Las skills usan esto para elegir comandos en vez de asumir pnpm/Vitest/Stryker.
#
# OJO: este repo es el SOURCE del propio plugin task-pipeline — sus entregables son
# skills en Markdown y hooks en Bash, no hay harness de tests JS/TS todavía. El stack
# refleja esa realidad. Con `mode: full`, los ítems de TDD y gate de mutation de la DoD
# no tienen herramienta que correr hasta que se añada un harness (p.ej. bats para los
# hooks). Cuando llegues al cierre de una tarea: o añades harness, o relajas las
# features (tdd / mutation-gate) o el preset (legacy / docs-only) según el caso.
# NOTA: el sub-proyecto `website/` (portal VitePress) SÍ usa pnpm, pero es un build de
# docs AISLADO, no el harness de tests del pipeline — no cambia este `stack: none`.
stack:
  language: other             # typescript | javascript | other  → Markdown + Bash
  package-manager: none       # pnpm | npm | yarn | none
  test-runner: none           # vitest | jest | node | none
  mutation-tool: none         # stryker | none

  # Override por-package (stack.packages.<pkg>): N/A aquí — este repo es SINGLE-PACKAGE
  # (task-pipeline, stack: none), no necesita override real. La regla de resolución CANÓNICA
  # vive en el README del plugin → "Configuración por repo" → "Stack por-package". Ausencia de
  # `packages` = comportamiento histórico (solo el stack plano), NO es drift.

# ── Features ──────────────────────────────────────────────────────────────────
features:
  # Escribir tests / TDD como parte de la DoD (Red→Green→Refactor, 1 test por
  # escenario Gherkin). En `false` la DoD NO exige tests (úsalo solo en legacy sin
  # harness o repos doc-only: vacía buena parte del valor del pipeline).
  tdd: true

  # Documentación al cerrar una tarea. Cada capa se activa por separado.
  closing-documentation:
    tsdoc: true            # doc en el código (TSDoc en TS; el equivalente del lenguaje)
    technical-docs: true   # doc técnica/contexto: README / CLAUDE.md / .claude/specs / ADRs
    context-log: true      # histórico de la tarea en .claude/context/<package>/<task-id>.md

  # Gate de cierre por tarea: mutation testing.
  #   false  → sin gate.
  #   true   → gate con umbral break:80 (default).
  #   <int>  → gate con ese umbral break (p.ej. 50 para ir subiendo el listón en legacy).
  mutation-gate: 80

  # SDD nativo (opt-in, default off). Eleva la fuente de verdad de la prosa suelta a
  # artefactos vivos: spec EARS (requisitos FR/SC) + casos de uso Gherkin + ADR MADR.
  # Con `true`: el Gherkin vive SOLO en el caso de uso (la tarea enlaza, no copia), la
  # DoD exige actualizar spec+CU (o declarar "sin cambios"), y al cerrar corre el gate
  # `/sdd-lint` (formato + completitud; ERROR bloquea / AVISO no) entre mutation y
  # fact-checker. Fuera de todo preset; solo `true` booleano activa (fail-safe).
  # El scaffolding SDD (spec.md/casos-de-uso/adr por package) se materializa desde las
  # plantillas en el primer uso o vía `/doctor` (categoría de scaffolding SDD).
  sdd: true

  # Modo caveman (comportamiento opt-in, default off). Comprime el OUTPUT del hilo
  # principal para ahorrar tokens; lo lee el hook UserPromptSubmit (caveman.sh), que se
  # auto-inhibe en los checkpoints (grilling/design-review/scenario-coverage/fact-checker).
  # NO forma parte de ningún preset (mode: full NO lo enciende). Valores canónicos:
  #   off  → desactivado (default)
  #   lite → compresión ligera (relleno/cortesías; gramática legible)
  #   full → compresión mayor (fragmentos); nunca toca código/comandos/errores/paths
  # Cualquier otro valor (mayúsculas, espacios, comentado, desconocido) → off (fail-safe).
  # Este repo (source del plugin) lo dogfoodea en `lite`.
  caveman: lite

  # Tracking opcional en GitHub Issues/Projects (opt-in, default off). Proyección
  # ONE-WAY md→GitHub: plan → issue PADRE, tarea → SUB-ISSUE. El .md sigue siendo la
  # fuente de verdad; GitHub es una proyección best-effort. Solo `enabled: true` activa
  # (valor no-canónico → off, fail-safe). Ver README del plugin → "GitHub tracking".
  github-tracking:
    enabled: true
    repo: drossan/claude-plugins        # explícito: gh authed (danielrosse) ≠ owner del remoto (drossan)
    project: 2                          # Project v2 de drossan — github.com/users/drossan/projects/2
    #                                   # WRITE al Project VERIFICADO: danielrosse (colaborador) SÍ resuelve
    #                                   # y edita el Status del board (write-spike 2026-07-23 + dogfood tarea
    #                                   # 02: #21 Backlog→In progress→Done, exit=0). Opciones reales del
    #                                   # Status: Backlog · Ready · In progress · In review · Done (match
    #                                   # por nombre, case-insensitive: "In progress" real, no "In Progress").
    assignee: "@me"                     # @me = identidad gh que arranca (danielrosse); login para fijar otro; false = no asignar
    # issue-type-plan:                  # no se usa; el plan se etiqueta con la label `plan`

  # Automatización de git (opt-in, default off). Fuera de todo preset; solo `true`
  # booleano activa cada toggle (fail-safe). Best-effort: si el commit/PR automático
  # falla (git/gh), se avisa y NO se bloquea el cambio de `status:` del .md.
  git-automation:
    auto-commit: true      # al cerrar cada tarea (tras su DoD, incl. fact-checker): commit `<task-id>: <mensaje>`
    auto-pr: true          # al cerrar el PLAN (última tarea): abre PR a la rama de integración. Requiere auto-commit
    co-author: false       # NUNCA el trailer de co-autor de Claude en los commits de la automatización

  # Conventional commits (default ON; INDEPENDIENTE de git-automation — rige el FORMATO
  # del mensaje tanto en commits manuales como automáticos). `false` lo relaja a mensaje
  # libre conservando el prefijo `<task-id>:`. Explícito aquí porque ahora auto-commit está on.
  conventional-commits: true

# ── Modelos por fase (subagentes) ─────────────────────────────────────────────
# Fija el modelo de las fases que lanzan un SUBAGENTE: `design-review`,
# `scenario-coverage` y `fact-checker`. Las fases INLINE (`grilling`, `mutation`, `plan-task`) heredan
# el modelo de la sesión y NO se rutan (limitación de plataforma — el porqué en el
# README del plugin → "Routing de modelo por fase").
#   clave ausente / `inherit`              → modelo de la sesión (no se fuerza nada)
#   alias o id de modelo (p.ej. `opus`)    → se pasa como `model` al lanzar el subagente
#   valor inválido (typo / id inexistente) → aviso + inherit (no se lanza roto)
#   clave para una fase inline             → se ignora (esa fase hereda la sesión)
models:
  design-review: opus
  scenario-coverage: sonnet
  fact-checker: sonnet